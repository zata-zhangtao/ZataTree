<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1828"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="local" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1e35"/>
      <stop offset="100%" stop-color="#14283f"/>
    </linearGradient>
    <linearGradient id="remote" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f3a6b"/>
      <stop offset="100%" stop-color="#2a4d8a"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9a3c"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1c3559" stroke-width="1" opacity="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- title -->
  <text x="600" y="95" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="bold">本地给路径，远程给协议</text>
  <text x="600" y="130" text-anchor="middle" fill="#a8c5e8" font-family="Arial, sans-serif" font-size="17">Agent 内容输出规范 · Agent 工程实战</text>

  <!-- left card: local -->
  <rect x="80" y="170" width="410" height="290" rx="14" fill="url(#local)" stroke="#4f9eff" stroke-width="2" opacity="0.95"/>
  <text x="100" y="205" fill="#7fb3ff" font-family="monospace" font-size="16"># 本地运行 · 给路径</text>
  <text x="100" y="248" fill="#dce8ff" font-family="monospace" font-size="15">$ python agent.py</text>
  <text x="100" y="290" fill="#a8d0ff" font-family="monospace" font-size="15">报告已生成:</text>
  <text x="100" y="325" fill="#4f9eff" font-family="monospace" font-size="15" font-weight="bold">/output/report.md</text>
  <text x="100" y="365" fill="#a8d0ff" font-family="monospace" font-size="15">图片: /output/chart.png</text>
  <text x="100" y="400" fill="#5d7ba0" font-family="Arial, sans-serif" font-size="13">肉眼可读 · shell 直接打开</text>
  <text x="100" y="435" fill="#ff9a3c" font-family="monospace" font-size="15"># print 出来就行 ✓</text>

  <!-- right card: remote -->
  <rect x="710" y="170" width="410" height="290" rx="14" fill="url(#remote)" stroke="#7c5cff" stroke-width="2" opacity="0.95"/>
  <text x="730" y="205" fill="#b8a5ff" font-family="monospace" font-size="16"># 远程服务 · 给协议</text>
  <text x="730" y="248" fill="#d4c5ff" font-family="monospace" font-size="15">POST /chat → SSE</text>
  <text x="730" y="280" fill="#dce8ff" font-family="monospace" font-size="13">data: {"type":"message_start"}</text>
  <text x="730" y="306" fill="#dce8ff" font-family="monospace" font-size="13">data: {"type":"text_delta"}</text>
  <text x="730" y="332" fill="#dce8ff" font-family="monospace" font-size="13">data: {"type":"tool_use"}</text>
  <text x="730" y="358" fill="#dce8ff" font-family="monospace" font-size="13">data: {"type":"tool_result"}</text>
  <text x="730" y="384" fill="#dce8ff" font-family="monospace" font-size="13">data: {"type":"artifact"}</text>
  <text x="730" y="420" fill="#7fe0d0" font-family="monospace" font-size="13">→ GET /artifacts/{id}</text>

  <!-- arrow -->
  <path d="M 505 315 L 680 315" stroke="url(#arrow)" stroke-width="4" fill="none"/>
  <polygon points="680,305 700,315 680,325" fill="#ff6b6b"/>
  <text x="595" y="295" text-anchor="middle" fill="#ff9a3c" font-family="Arial, sans-serif" font-size="18" font-weight="bold">远程化</text>

  <!-- footer tags -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#a8c5e8">
    <rect x="265" y="520" width="90" height="26" rx="4" fill="#1e3a5f" stroke="#4f9eff"/>
    <text x="310" y="538" text-anchor="middle">自然语言流</text>
    <rect x="378" y="520" width="100" height="26" rx="4" fill="#1e3a5f" stroke="#4f9eff"/>
    <text x="428" y="538" text-anchor="middle">工具调用事件</text>
    <rect x="496" y="520" width="115" height="26" rx="4" fill="#1e3a5f" stroke="#4f9eff"/>
    <text x="553" y="538" text-anchor="middle">产物 Artifact</text>
    <rect x="629" y="520" width="90" height="26" rx="4" fill="#1e3a5f" stroke="#7c5cff"/>
    <text x="674" y="538" text-anchor="middle">SSE 事件流</text>
    <rect x="737" y="520" width="90" height="26" rx="4" fill="#1e3a5f" stroke="#7c5cff"/>
    <text x="782" y="538" text-anchor="middle">AG-UI 标准</text>
    <rect x="845" y="520" width="95" height="26" rx="4" fill="#1e3a5f" stroke="#7c5cff"/>
    <text x="892" y="538" text-anchor="middle">Range 下载</text>
  </g>

  <!-- footer brand -->
  <text x="600" y="595" text-anchor="middle" fill="#5d7ba0" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">AGENT ENGINEERING IN PRACTICE · EP.04</text>
</svg>
