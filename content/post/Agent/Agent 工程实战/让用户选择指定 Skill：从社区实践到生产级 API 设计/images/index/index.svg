<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">让用户选择指定 Skill</title>
  <desc id="desc">展示用户、Skill Picker 与 Agent Runtime 之间结构化选择关系的几何封面</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10243e"/>
      <stop offset="1" stop-color="#20385d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b87bf"/>
      <stop offset="0.55" stop-color="#7768c5"/>
      <stop offset="1" stop-color="#32a6a0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1050" cy="90" r="210" fill="#5b87bf" opacity="0.08"/>
  <circle cx="110" cy="580" r="190" fill="#32a6a0" opacity="0.08"/>
  <rect x="80" y="72" width="1040" height="486" rx="30" fill="#132b49" stroke="#5b87bf" stroke-opacity="0.35"/>
  <text x="130" y="175" fill="#9fc4ee" font-family="sans-serif" font-size="24" letter-spacing="3">AGENT ENGINEERING</text>
  <text x="130" y="260" fill="#ffffff" font-family="sans-serif" font-size="58" font-weight="700">让用户选择指定 Skill</text>
  <text x="130" y="318" fill="#c3d4e8" font-family="sans-serif" font-size="28">从社区实践到生产级 API 设计</text>
  <rect x="130" y="380" width="270" height="78" rx="16" fill="#0c1d32" stroke="#5b87bf"/>
  <text x="165" y="430" fill="#e8f2ff" font-family="sans-serif" font-size="25">用户选择</text>
  <path d="M410 419 H500" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <path d="M486 405 L504 419 L486 433" fill="none" stroke="#7768c5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="520" y="380" width="240" height="78" rx="16" fill="url(#accent)"/>
  <text x="571" y="430" fill="#ffffff" font-family="sans-serif" font-size="25" font-weight="700">Skill ID</text>
  <path d="M770 419 H860" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <path d="M846 405 L864 419 L846 433" fill="none" stroke="#32a6a0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="880" y="380" width="190" height="78" rx="16" fill="#0c1d32" stroke="#32a6a0"/>
  <text x="916" y="430" fill="#e8f2ff" font-family="sans-serif" font-size="25">Runtime</text>
  <rect x="130" y="505" width="940" height="4" rx="2" fill="url(#accent)" opacity="0.8"/>
</svg>
