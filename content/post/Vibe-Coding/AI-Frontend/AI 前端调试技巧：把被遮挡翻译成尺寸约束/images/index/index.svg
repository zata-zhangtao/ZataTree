<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b87bf"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 装饰几何：代表层叠与遮挡 -->
  <g opacity="0.15">
    <rect x="780" y="80" width="340" height="220" rx="16" fill="#ffffff"/>
    <rect x="820" y="140" width="340" height="220" rx="16" fill="#ffffff"/>
    <rect x="860" y="200" width="340" height="220" rx="16" fill="#ffffff"/>
  </g>

  <!-- 左侧示意：被遮挡的大块 -->
  <g transform="translate(80, 160)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="240" rx="12" fill="#ffffff" opacity="0.9"/>
    <rect x="30" y="40" width="200" height="40" rx="6" fill="#5b87bf" opacity="0.9"/>
    <rect x="30" y="100" width="160" height="40" rx="6" fill="#764ba2" opacity="0.9"/>
    <rect x="30" y="160" width="120" height="40" rx="6" fill="#4fd1c5" opacity="0.9"/>
  </g>

  <!-- 遮挡层示意 -->
  <g transform="translate(300, 260)" opacity="0.85" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="140" rx="12" fill="#2d3748"/>
    <text x="110" y="80" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="600">上层遮挡</text>
  </g>

  <!-- 主标题 -->
  <text x="620" y="260" fill="#ffffff" font-family="sans-serif" font-size="64" font-weight="700">把"被遮挡"</text>
  <text x="620" y="340" fill="#ffffff" font-family="sans-serif" font-size="64" font-weight="700">翻译成尺寸约束</text>

  <!-- 副标题 / tag -->
  <text x="620" y="430" fill="#e2e8f0" font-family="sans-serif" font-size="32" font-weight="400">Vibe Coding · AI Frontend</text>

  <!-- 底部装饰线 -->
  <rect x="620" y="470" width="120" height="6" rx="3" fill="#4fd1c5" opacity="0.9"/>
</svg>