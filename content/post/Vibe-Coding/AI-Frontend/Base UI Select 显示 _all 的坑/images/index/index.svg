<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2333"/>
      <stop offset="1" stop-color="#2b3a55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b87bf"/>
      <stop offset="1" stop-color="#7e6bbf"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 装饰网格点 -->
  <g fill="#3a4a6b">
    <circle cx="1050" cy="120" r="4"/>
    <circle cx="1090" cy="120" r="4"/>
    <circle cx="1130" cy="120" r="4"/>
    <circle cx="1050" cy="160" r="4"/>
    <circle cx="1090" cy="160" r="4"/>
    <circle cx="1130" cy="160" r="4"/>
    <circle cx="70" cy="500" r="4"/>
    <circle cx="110" cy="500" r="4"/>
    <circle cx="150" cy="500" r="4"/>
    <circle cx="70" cy="540" r="4"/>
    <circle cx="110" cy="540" r="4"/>
    <circle cx="150" cy="540" r="4"/>
  </g>

  <!-- 下拉框示意：触发器 + 展开列表 -->
  <g>
    <rect x="90" y="180" width="360" height="72" rx="12" fill="#232c42" stroke="#5b87bf" stroke-width="2"/>
    <text x="120" y="226" font-family="monospace" font-size="34" fill="#e88a8a">_all</text>
    <path d="M 400 205 L 418 223 L 436 205" stroke="#8fa3c8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 转换箭头 -->
    <path d="M 480 216 L 590 216" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 590 216 L 568 202 M 590 216 L 568 230" stroke="#7e6bbf" stroke-width="5" fill="none" stroke-linecap="round"/>

    <rect x="620" y="180" width="400" height="72" rx="12" fill="#232c42" stroke="#7e6bbf" stroke-width="2"/>
    <text x="650" y="227" font-family="sans-serif" font-size="32" fill="#9fd6a8">全部来源</text>
    <path d="M 970 205 L 988 223 L 1006 205" stroke="#8fa3c8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 标题 -->
  <text x="90" y="360" font-family="sans-serif" font-size="56" font-weight="bold" fill="#eef2fa">下拉框里显示 _all？</text>
  <text x="90" y="440" font-family="sans-serif" font-size="40" fill="#b8c4dd">Base UI 与 Radix Select 的行为差异</text>

  <!-- 标签 -->
  <g font-family="monospace" font-size="24">
    <rect x="90" y="490" width="150" height="44" rx="22" fill="#31406b"/>
    <text x="118" y="520" fill="#a9c2ef">Base UI</text>
    <rect x="258" y="490" width="126" height="44" rx="22" fill="#31406b"/>
    <text x="288" y="520" fill="#a9c2ef">Radix</text>
    <rect x="402" y="490" width="150" height="44" rx="22" fill="#31406b"/>
    <text x="430" y="520" fill="#a9c2ef">Select</text>
  </g>
</svg>
